{% extends "base.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Dashboard</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <div class="bg-white shadow rounded-lg p-6 border-t-4 border-blue-600">
        <h3 class="text-xl font-bold">Total Libros</h3>
        <p class="text-4xl font-bold mt-2">{{ total_books }}</p>
    </div>

    <div class="bg-white shadow rounded-lg p-6 border-t-4 border-green-600">
        <h3 class="text-xl font-bold">Disponibles</h3>
        <p class="text-4xl font-bold mt-2">{{ available_books }}</p>
    </div>

    <div class="bg-white shadow rounded-lg p-6 border-t-4 border-red-600">
        <h3 class="text-xl font-bold">Prestados</h3>
        <p class="text-4xl font-bold mt-2">{{ borrowed_books }}</p>
    </div>

    <div class="bg-white shadow rounded-lg p-6 border-t-4 border-yellow-500">
        <h3 class="text-xl font-bold">Mis Préstamos</h3>
        <p class="text-4xl font-bold mt-2">{{ my_loans }}</p>
    </div>

</div>

{% endblock %}
