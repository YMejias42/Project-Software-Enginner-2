{% extends "base.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Mis Préstamos</h2>

<div class="space-y-4">

    {% for loan in loans %}
    <div class="bg-white shadow rounded-lg p-4 border-l-4 
        {% if loan['returned'] %}border-green-600{% else %}border-red-600{% endif %}">

        <h3 class="text-xl font-bold">{{ loan['title'] }}</h3>
        <p class="text-gray-600">{{ loan['author'] }}</p>

        <p class="mt-2"><strong>Fecha préstamo:</strong> {{ loan['loan_date'] }}</p>

        {% if loan['returned'] %}
            <p class="text-green-700 font-semibold mt-2">Devuelto el {{ loan['return_date'] }}</p>
        {% else %}
            <form action="{{ url_for('return_book', loan_id=loan['id']) }}" method="POST" class="mt-3">
                <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    Devolver libro
                </button>
            </form>
        {% endif %}

    </div>
    {% endfor %}

</div>

{% endblock %}
