{% extends "base.html" %}
{% block content %}

<h2 class="text-3xl font-bold text-gray-800 mb-6">Libros Prestados</h2>

<div class="space-y-4">

    {% for loan in loans %}
    <div class="bg-white shadow rounded-lg p-4 border-l-4 border-red-600">

        <h3 class="text-xl font-bold">{{ loan['title'] }}</h3>
        <p class="text-gray-600">{{ loan['author'] }}</p>

        <p class="mt-2"><strong>Prestado a:</strong> {{ loan['borrower'] }}</p>
        <p><strong>Fecha:</strong> {{ loan['loan_date'] }}</p>

    </div>
    {% endfor %}

</div>

{% endblock %}
