{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto bg-white shadow-md rounded-lg p-6 mt-6">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Editar Libro</h2>

    <form action="{{ url_for('edit_book', book_id=book['id']) }}" method="POST" class="space-y-4">

        <div>
            <label class="block font-semibold">Título</label>
            <input type="text" name="title" value="{{ book['title'] }}" required
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block font-semibold">Autor</label>
            <input type="text" name="author" value="{{ book['author'] }}" required
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block font-semibold">Año</label>
            <input type="number" name="year" value="{{ book['year'] }}"
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block font-semibold">Categoría</label>
            <select name="category" class="w-full border rounded px-3 py-2">
                <option {% if book['category']=="Novela" %}selected{% endif %}>Novela</option>
                <option {% if book['category']=="Clásico" %}selected{% endif %}>Clásico</option>
                <option {% if book['category']=="Fábula" %}selected{% endif %}>Fábula</option>
                <option {% if book['category']=="Cuentos" %}selected{% endif %}>Cuentos</option>
                <option {% if book['category']=="Misterio" %}selected{% endif %}>Misterio</option>
                <option {% if book['category']=="Distopía" %}selected{% endif %}>Distopía</option>
                <option {% if book['category']=="Otro" %}selected{% endif %}>Otro</option>
            </select>
        </div>

        <div>
            <label class="block font-semibold">Estado</label>
            <select name="status" class="w-full border rounded px-3 py-2">
                <option value="DISPONIBLE" {% if book['status']=="DISPONIBLE" %}selected{% endif %}>DISPONIBLE</option>
                <option value="PRESTADO" {% if book['status']=="PRESTADO" %}selected{% endif %}>PRESTADO</option>
            </select>
        </div>

        <div>
            <label class="block font-semibold">Color de Portada</label>
            <input type="color" name="cover_color" value="{{ book['cover_color'] }}"
                   class="w-20 h-10 border rounded">
        </div>

        <button class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
            Guardar Cambios
        </button>
    </form>
</div>

{% endblock %}
